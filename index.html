<body>

  <a class="skip" href="#sparks">skip to the sparks</a>

  <!-- the void -->
  <main class="void" id="void">
    <canvas id="sky" aria-hidden="true"></canvas>

    <header class="mark">
      <button class="mark-box" id="mark-box" type="button" aria-label="tao. gather the sparks, or turn the page">
        <span>T</span><span>A</span><span>O</span>
      </button>
      <div class="reader" id="reader" aria-live="polite">
        <div class="page idle">
          <span>Geo AI @ <a href="https://www.utexas.edu/" target="_blank" rel="noreferrer">UT</a></span>
          <span><a href="https://sites.utexas.edu/gisense/" target="_blank" rel="noreferrer">GISense Lab</a></span>
        </div>
      </div>
    </header>

    <!-- button per spark -->
    <div class="a11y" id="sparks" aria-label="sparks"></div>
  </main>

  <div id="toast" aria-live="polite"></div>

  <!-- print -->
  <article class="paper" id="paper" aria-hidden="true"></article>

  <script type="module" src="/src/main.js"></script>
</body>
