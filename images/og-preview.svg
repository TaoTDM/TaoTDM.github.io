<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#1376A4" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <pattern id="gridmajor" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0 L0 0 0 200" fill="none" stroke="#1376A4" stroke-opacity="0.13" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- paper background + graticule -->
  <rect width="1200" height="630" fill="#fffefa"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#gridmajor)"/>

  <!-- crop marks, corners -->
  <path d="M1150 40 L1170 40 1170 60" fill="none" stroke="#b8b2a4" stroke-width="1.5"/>
  <path d="M1150 590 L1170 590 1170 570" fill="none" stroke="#b8b2a4" stroke-width="1.5"/>
  <path d="M50 40 L30 40 30 60" fill="none" stroke="#b8b2a4" stroke-width="1.5"/>
  <path d="M50 590 L30 590 30 570" fill="none" stroke="#b8b2a4" stroke-width="1.5"/>

  <!-- cartouche double frame -->
  <rect x="70" y="56" width="1060" height="518" fill="none" stroke="#1A1A1A" stroke-width="2.5"/>
  <rect x="82" y="68" width="1036" height="494" fill="none" stroke="#1A1A1A" stroke-width="1"/>

  <!-- ornament masks + glyphs on the outer border -->
  <rect x="150" y="42" width="34" height="28" fill="#fffefa"/>
  <text x="167" y="65" text-anchor="middle" font-family="Maple Mono NF, monospace" font-size="24" fill="#A4133C">&#10022;</text>
  <rect x="1016" y="42" width="34" height="28" fill="#fffefa"/>
  <text x="1033" y="65" text-anchor="middle" font-family="Maple Mono NF, monospace" font-size="24" fill="#A4133C">&#10022;</text>

  <!-- chart number caption -->
  <text x="600" y="140" text-anchor="middle" font-family="Maple Mono NF, monospace" font-size="16" letter-spacing="5" fill="#b8b2a4">CHART N&#186; 3 &#183; WORKS &amp; UNDERTAKINGS</text>

  <!-- title -->
  <text x="600" y="245" text-anchor="middle" font-family="Iowan Old Style, Georgia, serif" font-size="98" fill="#A4133C">Shi-Tao Chang</text>

  <!-- subtitle -->
  <text x="600" y="292" text-anchor="middle" font-family="Iowan Old Style, Georgia, serif" font-style="italic" font-size="30" fill="#1376A4">being a faithful survey of code, language &amp; land</text>

  <!-- coordinates -->
  <text x="600" y="336" text-anchor="middle" font-family="Maple Mono NF, monospace" font-size="19" letter-spacing="1" fill="#1A1A1A">lat 30&#176;17&#8242;N &#183; lon 097&#176;44&#8242;W &#183; austin, texas</text>

  <!-- scale bar -->
  <g transform="translate(600,372)">
    <rect x="-84" y="0" width="42" height="7" fill="#1A1A1A" stroke="#1A1A1A"/>
    <rect x="-42" y="0" width="42" height="7" fill="none" stroke="#1A1A1A"/>
    <rect x="0" y="0" width="42" height="7" fill="#1A1A1A" stroke="#1A1A1A"/>
    <rect x="42" y="0" width="42" height="7" fill="none" stroke="#1A1A1A"/>
    <text x="140" y="8" font-family="Maple Mono NF, monospace" font-size="13" letter-spacing="1" fill="#b8b2a4">scale of miles, more or less</text>
  </g>

  <!-- compass rose -->
  <g transform="translate(600,472)">
    <circle r="66" fill="none" stroke="#b8b2a4" stroke-width="1.2"/>
    <circle r="54" fill="none" stroke="#b8b2a4" stroke-width="0.8" stroke-dasharray="3 5"/>
    <line x1="0" y1="-66" x2="0" y2="-50" stroke="#b8b2a4" stroke-width="1.2"/>
    <line x1="0" y1="66" x2="0" y2="50" stroke="#b8b2a4" stroke-width="1.2"/>
    <line x1="-66" y1="0" x2="-50" y2="0" stroke="#b8b2a4" stroke-width="1.2"/>
    <line x1="66" y1="0" x2="50" y2="0" stroke="#b8b2a4" stroke-width="1.2"/>
    <text x="0" y="-76" text-anchor="middle" font-family="Maple Mono NF, monospace" font-size="15" fill="#A4133C">N</text>
    <text x="0" y="90" text-anchor="middle" font-family="Maple Mono NF, monospace" font-size="15" fill="#b8b2a4">S</text>
    <text x="-80" y="5" text-anchor="middle" font-family="Maple Mono NF, monospace" font-size="15" fill="#b8b2a4">W</text>
    <text x="80" y="5" text-anchor="middle" font-family="Maple Mono NF, monospace" font-size="15" fill="#b8b2a4">E</text>
    <g transform="rotate(18)">
      <polygon points="0,-44 6,0 0,0 -6,0" fill="#A4133C"/>
      <polygon points="0,44 6,0 0,0 -6,0" fill="#fffefa" stroke="#1A1A1A" stroke-width="1"/>
      <circle r="4.5" fill="#A4133C"/>
    </g>
  </g>

  <!-- footer -->
  <text x="600" y="594" text-anchor="middle" font-family="Maple Mono NF, monospace" font-size="15" letter-spacing="3" fill="#b8b2a4">TAOTDM.GITHUB.IO</text>
</svg>
